aid: emerge-tools
name: Emerge Tools
description: >-
  Emerge Tools is a mobile developer-tools platform used by teams at DoorDash, Square, and Duolingo to
  ship faster, smaller, better-performing iOS and Android apps. Its products include Size Analysis (monitor
  and reduce app size with PR alerts and competitor benchmarking), Snapshots (visual regression testing for
  SwiftUI and Jetpack Compose), Build Distribution (share iOS/Android builds via QR or web), Reaper (runtime
  dead-code detection), Launch Booster (order-file startup optimization), and Performance testing. The Emerge
  API (OpenAPI 3.1.0, api.emergetools.com) exposes build upload, size/PR analysis, snapshot comparison,
  performance results, and Reaper dead-code export, authenticated with an X-API-Token key. Emerge is joining Sentry.
