source: https://docs.emergetools.com/docs/emerge-cli
name: emerge
description: The official CLI for Emerge Tools.
install:
  - method: rubygems
    command: gem install emerge
package: rubygems:emerge
source_repo: https://github.com/EmergeTools/emerge-cli
auth:
  env: EMERGE_API_TOKEN
  flag: --api-token
commands:
  - group: upload
    subcommands:
      - name: snapshots
        invocation: emerge upload snapshots
        description: Upload an image directory to Emerge's snapshot testing system.
